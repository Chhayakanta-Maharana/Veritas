# Dataset Configuration for Doomsday Sentinel Forensics Pipeline
dataset:
  name: "Doomsday-Sentinel-Forensics-Benchmark"
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  manifest_path: "data/manifests/dataset_manifest.csv"
  train_manifest_path: "data/manifests/train_manifest.csv"
  val_manifest_path: "data/manifests/val_manifest.csv"
  test_manifest_path: "data/manifests/test_manifest.csv"
  
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
    
  random_seed: 42
  
  labels:
    REAL: 0
    FAKE: 1
    
  face_detection:
    method: "haarcascade_with_fallback"
    margin_ratio: 0.20
    fallback_policy: "center_crop"
    min_face_size: [64, 64]
    
  preprocessing:
    image_size: [224, 224]
    color_space: "RGB"
    normalization:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
      
  augmentation:
    horizontal_flip_prob: 0.5
    color_jitter:
      brightness: 0.1
      contrast: 0.1
      saturation: 0.1
      hue: 0.05
    gaussian_blur_prob: 0.2
    jpeg_compression_quality: [60, 95]
