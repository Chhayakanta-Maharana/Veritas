<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="hoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="50%" stop-color="#0a3523" />
      <stop offset="100%" stop-color="#04180f" />
    </linearGradient>
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="emeraldEye" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="doomGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hood Cowl -->
  <path d="M50 4 C32 10, 16 28, 14 54 C12 70, 6 88, 4 96 C16 92, 28 88, 36 84 C38 68, 38 52, 42 42 C46 36, 54 36, 58 42 C62 52, 62 68, 64 84 C72 88, 84 92, 96 96 C94 88, 88 70, 86 54 C84 28, 68 10, 50 4 Z" fill="url(#hoodGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Inner Hood Shadow -->
  <path d="M50 12 C36 18, 24 32, 22 52 C20 66, 22 76, 26 82 C30 64, 32 46, 38 38 C42 32, 58 32, 62 38 C68 46, 70 64, 74 82 C78 76, 80 66, 78 52 C76 32, 64 18, 50 12 Z" fill="#030c07" />

  <!-- Doctor Doom Iron Mask -->
  <!-- Forehead & Brow Plate -->
  <path d="M34 38 L66 38 L63 48 L50 51 L37 48 Z" fill="url(#maskGrad)" stroke="#64748b" stroke-width="0.8" />
  <circle cx="36" cy="41" r="1.2" fill="#1e293b" />
  <circle cx="64" cy="41" r="1.2" fill="#1e293b" />
  <circle cx="50" cy="41" r="1.2" fill="#1e293b" />

  <!-- Piercing Angular Eye Sockets -->
  <!-- Left Eye Socket -->
  <polygon points="34,48 46,50 44,57 33,53" fill="#020617" />
  <!-- Left Eye Glowing Pupil -->
  <ellipse cx="40" cy="53" rx="4" ry="1.5" fill="url(#emeraldEye)" filter="url(#doomGlow)" />

  <!-- Right Eye Socket -->
  <polygon points="66,48 54,50 56,57 67,53" fill="#020617" />
  <!-- Right Eye Glowing Pupil -->
  <ellipse cx="60" cy="53" rx="4" ry="1.5" fill="url(#emeraldEye)" filter="url(#doomGlow)" />

  <!-- Nose & Central Bridge Plate -->
  <polygon points="50,49 47,65 50,68 53,65" fill="#94a3b8" stroke="#334155" stroke-width="0.6" />

  <!-- Cheekbones & Upper Faceplate -->
  <path d="M33 54 L36 68 L46 66 L44 58 Z" fill="url(#maskGrad)" stroke="#475569" stroke-width="0.6" />
  <path d="M67 54 L64 68 L54 66 L56 58 Z" fill="url(#maskGrad)" stroke="#475569" stroke-width="0.6" />

  <!-- Slotted Titanium Mouth / Jaw Grille -->
  <path d="M37 68 L50 71 L63 68 L60 84 L50 86 L40 84 Z" fill="url(#maskGrad)" stroke="#334155" stroke-width="0.8" />
  <!-- Vertical Ventilator Slits -->
  <line x1="44" y1="74" x2="44" y2="81" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" />
  <line x1="47" y1="74.5" x2="47" y2="82" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" />
  <line x1="50" y1="75" x2="50" y2="82.5" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" />
  <line x1="53" y1="74.5" x2="53" y2="82" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" />
  <line x1="56" y1="74" x2="56" y2="81" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" />

  <!-- Chin Hex Rivets -->
  <circle cx="41" cy="81" r="0.9" fill="#1e293b" />
  <circle cx="59" cy="81" r="0.9" fill="#1e293b" />
</svg>
