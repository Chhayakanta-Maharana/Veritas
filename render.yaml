services:
  - type: web
    name: veritas-sentinel-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend.config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120"
    healthCheckPath: "/api/health/"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

